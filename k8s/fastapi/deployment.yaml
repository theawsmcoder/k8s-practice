apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: k8s-test-app
  namespace: k8s-dev
  labels:
    app: k8s-test-app
    version: v1 
spec: 
  replicas: 2
  selector:
    matchLabels:
      app: k8s-test-app 
  template: 
    metadata:
      name: k8s-test-app
      labels:
        app: k8s-test-app
    spec:
      containers: 
        - name: k8s-test-app 
          image: k8s-test:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fastapi-config
            - secretRef:
                name: fastapi-secret
          resources: 
            requests: 
              cpu: "128m"
              memory: "128Mi" 
            limits:
              cpu: "256m"
              memory: "256Mi"